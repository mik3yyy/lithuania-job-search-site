<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Matches</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #17171a; color: #eee; } .card { background: #232326 !important; border-color: #333 !important; } }
  h1 { font-size: 22px; }
  .updated { color: #888; font-size: 13px; margin-bottom: 24px; }
  .card { border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; margin-bottom: 14px; background: #fff; }
  .source { font-size: 12px; color: #888; }
  .title { font-size: 17px; font-weight: 600; margin: 4px 0; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .company { font-size: 14px; color: #555; }
  .reason { font-size: 13px; color: #2a7a2a; margin-top: 8px; }
  .empty { color: #888; text-align: center; margin-top: 60px; }
</style>
</head>
<body>
  <h1>Job Matches — Elizabeth</h1>
  <div class="updated" id="updated"></div>
  <div id="jobs"></div>

  <script>
    fetch('jobs.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        document.getElementById('updated').textContent = 'Last updated: ' + new Date(data.updated).toLocaleString();
        const container = document.getElementById('jobs');
        if (!data.jobs.length) {
          container.innerHTML = '<div class="empty">No matching jobs right now — check back tomorrow.</div>';
          return;
        }
        container.innerHTML = data.jobs.map(j => `
          <div class="card">
            <div class="source">${j.source} · ${j.location}</div>
            <div class="title"><a href="${j.url}" target="_blank" rel="noopener">${j.title}</a></div>
            <div class="company">${j.company}</div>
            <div class="reason">✓ ${j.match_reason || ''}</div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('jobs').innerHTML = '<div class="empty">Could not load jobs.json</div>';
      });
  </script>
</body>
</html>
