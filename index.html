<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Matches</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #17171a; color: #eee; } .card, .batch-header { background: #232326 !important; border-color: #333 !important; } }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 28px; }
  .batch-header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 4px; border-bottom: 2px solid #ddd; margin-bottom: 14px; }
  .batch-date { font-weight: 600; font-size: 15px; }
  .batch-count { color: #888; font-size: 13px; }
  .card { border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; margin-bottom: 14px; background: #fff; }
  .source { font-size: 12px; color: #888; }
  .title { font-size: 17px; font-weight: 600; margin: 4px 0; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .company { font-size: 14px; color: #555; }
  .reason { font-size: 13px; color: #2a7a2a; margin-top: 8px; }
  .empty { color: #888; text-align: center; margin: 40px 0; }
  #history-toggle { display: block; width: 100%; text-align: center; padding: 12px; margin-top: 20px; border: 1px dashed #ccc; border-radius: 10px; background: none; color: #666; font-size: 14px; cursor: pointer; }
  #history { display: none; margin-top: 20px; }
  #history.open { display: block; }
  .history-batch { margin-bottom: 28px; }
  #companies-toggle { display: block; width: 100%; text-align: center; padding: 12px; margin-top: 12px; border: 1px dashed #ccc; border-radius: 10px; background: none; color: #666; font-size: 14px; cursor: pointer; }
  #companies-list { display: none; margin-top: 16px; }
  #companies-list.open { display: block; }
  .company-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #e0e0e0; }
  @media (prefers-color-scheme: dark) { .company-row { border-color: #333; } }
  .company-name { font-size: 14px; font-weight: 600; }
  .company-why { font-size: 12px; color: #888; margin-top: 2px; }
  .company-link { font-size: 13px; color: #2a6ad4; text-decoration: none; white-space: nowrap; }
  .company-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>Job Matches — Elizabeth</h1>
  <div class="subtitle" id="subtitle">Loading…</div>

  <button id="run-now" onclick="runNow()" style="display:block;width:100%;text-align:center;padding:12px;margin-bottom:8px;border:none;border-radius:10px;background:#1a1a1a;color:#fff;font-weight:600;font-size:15px;cursor:pointer;">
    ↻ Run a new search now
  </button>
  <div id="run-now-status" style="text-align:center;font-size:13px;color:#888;margin-bottom:20px;min-height:16px;"></div>

  <div id="latest"></div>

  <button id="history-toggle" onclick="toggleHistory()">Show previous batches ▾</button>
  <div id="history"></div>

  <button id="companies-toggle" onclick="toggleCompanies()">Show companies we're watching ▾</button>
  <div id="companies-list"></div>

  <script>
    const TRIGGER_URL = 'https://lithuania-job-trigger.miketransport.workers.dev';
    const TRIGGER_KEY = '36f4095167d5fcdd7f2ca83e1e4ee22d';

    function runNow() {
      const btn = document.getElementById('run-now');
      const status = document.getElementById('run-now-status');
      btn.disabled = true;
      status.textContent = 'Starting a new search…';
      fetch(`${TRIGGER_URL}?key=${TRIGGER_KEY}`)
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          status.textContent = ok ? data.message : data.error;
          btn.disabled = false;
        })
        .catch(() => {
          status.textContent = 'Could not reach the search trigger — try again shortly.';
          btn.disabled = false;
        });
    }

    let allBatches = [];

    function jobCard(j) {
      return `
        <div class="card">
          <div class="source">${j.source} · ${j.location}</div>
          <div class="title"><a href="${j.url}" target="_blank" rel="noopener">${j.title}</a></div>
          <div class="company">${j.company}</div>
          <div class="reason">✓ ${j.match_reason || ''}</div>
        </div>`;
    }

    function batchBlock(batch, isLatest) {
      const date = new Date(batch.created).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      const jobsHtml = batch.jobs.length
        ? batch.jobs.map(jobCard).join('')
        : '<div class="empty">No new matching jobs in this batch.</div>';
      return `
        <div class="${isLatest ? '' : 'history-batch'}">
          <div class="batch-header">
            <span class="batch-date">${isLatest ? 'Latest — ' : ''}${date}</span>
            <span class="batch-count">${batch.jobs.length} job${batch.jobs.length !== 1 ? 's' : ''}</span>
          </div>
          ${jobsHtml}
        </div>`;
    }

    function toggleHistory() {
      const el = document.getElementById('history');
      const btn = document.getElementById('history-toggle');
      const open = el.classList.toggle('open');
      btn.textContent = open ? 'Hide previous batches ▴' : 'Show previous batches ▾';
    }

    let companiesLoaded = false;

    function companyRow(c) {
      return `
        <div class="company-row">
          <div>
            <div class="company-name">${c.name}</div>
            ${c.why ? `<div class="company-why">${c.why}</div>` : ''}
          </div>
          <a class="company-link" href="${c.careers_url}" target="_blank" rel="noopener">careers page ↗</a>
        </div>`;
    }

    function toggleCompanies() {
      const el = document.getElementById('companies-list');
      const btn = document.getElementById('companies-toggle');
      const open = el.classList.toggle('open');
      btn.textContent = open
        ? "Hide companies we're watching ▴"
        : `Show companies we're watching ▾`;

      if (open && !companiesLoaded) {
        el.innerHTML = '<div class="empty">Loading…</div>';
        fetch('companies.json?t=' + Date.now())
          .then(r => r.json())
          .then(companies => {
            companiesLoaded = true;
            companies.sort((a, b) => a.name.localeCompare(b.name));
            btn.textContent = `Hide companies we're watching (${companies.length}) ▴`;
            el.innerHTML = companies.length
              ? companies.map(companyRow).join('')
              : '<div class="empty">No companies yet.</div>';
          })
          .catch(() => {
            el.innerHTML = '<div class="empty">Could not load companies.json</div>';
          });
      }
    }

    fetch('batches.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        allBatches = data.batches || [];
        document.getElementById('subtitle').textContent =
          `Last updated: ${new Date(data.updated).toLocaleString()} · ${allBatches.length} batch${allBatches.length !== 1 ? 'es' : ''} total`;

        if (!allBatches.length) {
          document.getElementById('latest').innerHTML = '<div class="empty">No batches yet — check back after the first run.</div>';
          document.getElementById('history-toggle').style.display = 'none';
          return;
        }

        document.getElementById('latest').innerHTML = batchBlock(allBatches[0], true);

        const older = allBatches.slice(1);
        if (older.length) {
          document.getElementById('history').innerHTML = older.map(b => batchBlock(b, false)).join('');
        } else {
          document.getElementById('history-toggle').style.display = 'none';
        }
      })
      .catch(() => {
        document.getElementById('latest').innerHTML = '<div class="empty">Could not load batches.json</div>';
      });
  </script>
</body>
</html>
